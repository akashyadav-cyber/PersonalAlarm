name: Build PersonalAlarm APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Test Android App
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v6

      # 2. Setup Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # 3. Install and configure Gradle
      #    The repository currently does not contain ./gradlew,
      #    so we use a system-installed Gradle distribution.
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      # 4. Verify Java and Gradle
      - name: Verify build environment
        run: |
          java -version
          gradle --version

      # 5. Run unit tests
      - name: Run unit tests
        run: gradle test

      # 6. Build debug APK
      - name: Build debug APK
        run: gradle assembleDebug

      # 7. Verify APK exists
      - name: Verify APK
        run: |
          if [ ! -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "ERROR: Debug APK was not generated."
            echo "Searching for generated APK files..."
            find . -type f -name "*.apk" -print
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      # 8. Upload APK
      - name: Upload PersonalAlarm APK
        uses: actions/upload-artifact@v4
        with:
          name: PersonalAlarm-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
